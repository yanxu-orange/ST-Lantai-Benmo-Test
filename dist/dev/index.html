<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>兰台本末 · 虚构数据 UI 预览</title>
  <link rel="stylesheet" href="../vendor/plugin-ui-system/web.css">
  <link rel="stylesheet" href="./harness.css">
</head>
<body>
  <main class="preview-welcome">
    <h1>兰台本末 · UI 预览</h1>
    <p>全部记忆、聊天、设置和 AI 回复均为虚构。不会连接真实酒馆或模型服务。</p>
    <p>请勿输入真实 Key 或私人资料。改动仅保存在本页内存中，刷新即重置。</p>
    <p>打开后可从底部“设置 → 外观”切换孟菲斯与雪山白鼬；关闭面板后可在此重新打开。</p>
    <div class="dev-controls">
      <label>虚构聊天 <select id="preview-chat"><option>A</option><option>B</option></select></label>
      <button type="button" id="preview-reset">重置预览</button>
    </div>
    <div id="extensionsMenu"></div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
